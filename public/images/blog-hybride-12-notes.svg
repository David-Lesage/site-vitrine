<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="system-ui, sans-serif" role="img" aria-label="Les douze notes de la musique. Un handpan D Kurd 10 en porte sept ; le Neotone apporte les cinq qui manquent : do dièse, ré dièse, fa dièse, sol dièse et si.">
  <rect width="1200" height="620" fill="#f4ebd9"/>
  <text x="66" y="66" fill="#1f1611" font-size="27" font-weight="700">Un D Kurd 10 tout seul — la gamme la plus répandue</text>
  <text x="66" y="100" fill="#3a2c22" font-size="21" opacity="0.8">10 creux, 7 notes différentes sur les 12 de la musique, et rien sous le ré₃.</text>
  <rect x="66" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="105" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">C</text>
  <rect x="156" y="130" width="78" height="78" rx="14" fill="none" stroke="#3a2c22" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="195" y="180" fill="#3a2c22" fill-opacity="0.35" font-size="30" font-weight="700" text-anchor="middle">C#</text>
  <rect x="246" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="285" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">D</text>
  <rect x="336" y="130" width="78" height="78" rx="14" fill="none" stroke="#3a2c22" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="375" y="180" fill="#3a2c22" fill-opacity="0.35" font-size="30" font-weight="700" text-anchor="middle">D#</text>
  <rect x="426" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="465" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">E</text>
  <rect x="516" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="555" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">F</text>
  <rect x="606" y="130" width="78" height="78" rx="14" fill="none" stroke="#3a2c22" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="645" y="180" fill="#3a2c22" fill-opacity="0.35" font-size="30" font-weight="700" text-anchor="middle">F#</text>
  <rect x="696" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="735" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">G</text>
  <rect x="786" y="130" width="78" height="78" rx="14" fill="none" stroke="#3a2c22" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="825" y="180" fill="#3a2c22" fill-opacity="0.35" font-size="30" font-weight="700" text-anchor="middle">G#</text>
  <rect x="876" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="915" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">A</text>
  <rect x="966" y="130" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="1005" y="180" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">A#</text>
  <rect x="1056" y="130" width="78" height="78" rx="14" fill="none" stroke="#3a2c22" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1095" y="180" fill="#3a2c22" fill-opacity="0.35" font-size="30" font-weight="700" text-anchor="middle">B</text>
  <text x="66" y="248" fill="#8a3a1f" font-size="22" font-weight="700">5 notes n'existent nulle part sous mes mains — quoi que je joue.</text>
  <g transform="translate(600 300)">
    <path d="M0 -18 L0 26" stroke="#b8722f" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 34 l -13 -20 h 26 z" fill="#b8722f"/>
  </g>
  <text x="640" y="318" fill="#3a2c22" font-size="21" opacity="0.85">on pose un Neotone à côté</text>
  <text x="66" y="416" fill="#1f1611" font-size="27" font-weight="700">Le même D Kurd 10 + un Neotone</text>
  <text x="66" y="450" fill="#3a2c22" font-size="21" opacity="0.8">Les pads du Neotone n'ont aucune contrainte de placement : on y met exactement ce qui manque.</text>
  <rect x="66" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="105" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">C</text>
  <rect x="156" y="480" width="78" height="78" rx="14" fill="#c8a866" stroke="#8a3a1f" stroke-width="3"/>
  <text x="195" y="530" fill="#1f1611" font-size="30" font-weight="700" text-anchor="middle">C#</text>
  <rect x="246" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="285" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">D</text>
  <rect x="336" y="480" width="78" height="78" rx="14" fill="#c8a866" stroke="#8a3a1f" stroke-width="3"/>
  <text x="375" y="530" fill="#1f1611" font-size="30" font-weight="700" text-anchor="middle">D#</text>
  <rect x="426" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="465" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">E</text>
  <rect x="516" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="555" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">F</text>
  <rect x="606" y="480" width="78" height="78" rx="14" fill="#c8a866" stroke="#8a3a1f" stroke-width="3"/>
  <text x="645" y="530" fill="#1f1611" font-size="30" font-weight="700" text-anchor="middle">F#</text>
  <rect x="696" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="735" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">G</text>
  <rect x="786" y="480" width="78" height="78" rx="14" fill="#c8a866" stroke="#8a3a1f" stroke-width="3"/>
  <text x="825" y="530" fill="#1f1611" font-size="30" font-weight="700" text-anchor="middle">G#</text>
  <rect x="876" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="915" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">A</text>
  <rect x="966" y="480" width="78" height="78" rx="14" fill="#b8722f"/>
  <text x="1005" y="530" fill="#f4ebd9" font-size="30" font-weight="700" text-anchor="middle">A#</text>
  <rect x="1056" y="480" width="78" height="78" rx="14" fill="#c8a866" stroke="#8a3a1f" stroke-width="3"/>
  <text x="1095" y="530" fill="#1f1611" font-size="30" font-weight="700" text-anchor="middle">B</text>
  <text x="66" y="596" fill="#3a2c22" font-size="22" font-weight="700">Les 12 notes sont là.</text>
  <text x="345" y="596" fill="#8a3a1f" font-size="22" font-weight="700">En or : les 5 apportées par le Neotone.</text>
</svg>