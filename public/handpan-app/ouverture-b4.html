 layers.forEach((l,i)=>{l.g.setAttribute('transform',`translate(${f1(Math.sin(t*.09+i)*l.px)},${f1(Math.cos(t*.07+i)*l.px*.6)})`);
  l.st.forEach(([c,o,ph,w,am])=>c.setAttribute('opacity',f3(sky*(o+am*Math.sin(t*w+ph)))))});
 sub.setAttribute('opacity',f3(cl(t,.9,2)*(.75+.25*br)));
 // notes : allumage, convergence vers le handpan, puis vers le cœur de l'étoile
 const conv=io(cl(t,3,4)),toC=io(cl(t,4.3,5));
 N.forEach(o=>{const pop=cl(t,.3+o.k*.12,.9+o.k*.12),sc=ob(pop);let[x,y]=o.s0,op=pop;
  if(o.t){x=lerp(x,o.t[0],conv);y=lerp(y,o.t[1],conv)}else op*=1-cl(t,3.1,3.8);
  x*=1-toC;y*=1-toC;if(!o.t)op=Math.max(op,cl(t,4.4,4.7));
  setXY(o,x,y);o.g.setAttribute('transform',`translate(${f1(x)},${f1(y)}) scale(${f3(Math.max(.01,sc)*(1-.5*toC))}) translate(${f1(-x)},${f1(-y)})`);
  o.h.setAttribute('opacity',f3(.7*(1-.2*Math.sin(t*1.7+o.k))));o.sp.setAttribute('transform',`translate(${f1(x)},${f1(y)}) rotate(${f1(45*pop)})`);
  o.sp.setAttribute('opacity',f3(Math.sin(Math.PI*pop)*.8*(1-conv)));o.g.setAttribute('opacity',f3(op*(1-cl(t,4.7,5))))});
 CH.forEach(c=>{c.p.setAttribute('d','M'+c.ix.map(o=>f1(o.d.getAttribute('cx'))+' '+f1(o.d.getAttribute('cy'))).join('L')+'Z');
  c.p.setAttribute('stroke-dashoffset',f3(1-io(cl(t,c.a,c.a+.9))));const f=cl(t,c.a+1,c.a+1.7);
  c.p.setAttribute('stroke-width',f3(.9-.4*f));c.p.setAttribute('stroke-opacity',f3(1-.35*f))});
 cons.setAttribute('opacity',f3(1-cl(t,4.2,4.7)));
 // handpan : apparaît sous les constellations réunies, puis se résorbe dans l'étoile
 const hpo=cl(t,3.3,4)*(1-cl(t,4.4,4.9)),hps=lerp(.94,1,oc(cl(t,3.3,4.3)))*(1-.8*io(cl(t,4.3,5.1)));
 hp.setAttribute('opacity',f3(hpo));hp.setAttribute('transform',`scale(${f3(hps)})`);extra.forEach((g,i)=>g.setAttribute('opacity',f3(cl(t,3.6+i*.15,4+i*.15))));
 // l'étoile s'allume
 const se=cl(t,4.4,4.9);star.setAttribute('opacity',f3(se));const pulse=1+.03*br;
 star.setAttribute('transform',`scale(${f3(pulse)})`);rays.setAttribute('transform',`rotate(${f1(lp*1.6)})`);
 const wd=io(cl(t,5.1,6.3)),rayDim=1-.45*wd;
 RY.forEach(r=>{const e=oc(cl(t,4.6+r.k*.04,5.6+r.k*.04)),Lr=r.L*e*(1+.07*Math.sin(lp*1.4+r.k*.9));r.p.setAttribute('points',`-3 0 0 ${f1(-Lr)} 3 0`);r.p.setAttribute('opacity',f3(rayDim))});
 RF.forEach(r=>{const e=oc(cl(t,4.8+r.k*.04,5.7+r.k*.04)),Lr=r.L*e*(1+.1*Math.sin(lp*1.9+r.k));r.p.setAttribute('y2',f1(-Lr));r.p.setAttribute('stroke-opacity',f3(.55*e*rayDim))});
 halo.setAttribute('opacity',f3(oc(cl(t,4.7,6.1))*(.8+.12*br)));halo.setAttribute('r',f1(230+12*br));
 coreG.setAttribute('opacity',f3(oc(cl(t,4.55,5.2))*(.85+.15*br)*(1-.55*wd)));core.setAttribute('opacity',f3(oc(cl(t,4.5,5))*(1-.4*wd)));core.setAttribute('r',f1(7+1.2*br));
 PT.forEach(p=>{const u=((t-5.1)+p.ph)%6,r=16+u*p.v,aa=p.a+u*p.sw,op=cl(t,5.1,5.9)*Math.sin(Math.PI*u/6)*.9;p.c.setAttribute('cx',f1(Math.sin(aa)*r));p.c.setAttribute('cy',f1(-Math.cos(aa)*r));p.c.setAttribute('opacity',f3(Math.max(0,op)))});
 // le cycle des quintes complet se déploie depuis l'étoile
 wheel.setAttribute('opacity',f3(cl(t,5.1,5.6)));wheel.setAttribute('transform',`scale(${f3(lerp(.08,1,wd)*(1+.012*br))}) rotate(${f1(-30*(1-wd))})`);
 NET.forEach(n=>n.p.setAttribute('stroke-dashoffset',f3(1-io(cl(t,5.2+n.dl*1.2,6.1+n.dl*1.2)))));
 net.setAttribute('opacity',f3(.75+.12*br));
 ND1.forEach((g,k)=>g.setAttribute('opacity',f3(cl(t,5.6+k*.05,6+k*.05))));ND2.forEach((g,k)=>g.setAttribute('opacity',f3(cl(t,5.9+k*.04,6.3+k*.04))));ND3.forEach((g,k)=>g.setAttribute('opacity',f3(cl(t,6.2+k*.03,6.5+k*.03))));
 // le nom apparaît dans le rayonnement
 const ne=oc(cl(t,6.3,7.3));name.setAttribute('opacity',f3(ne));
 NM.forEach(([tx,sh],i)=>{tx.setAttribute('letter-spacing',f3(.34+.5*(1-ne))+'em');sh.setAttribute('letter-spacing',f3(.34+.5*(1-ne))+'em');sh.setAttribute('opacity',f3(.9*Math.sin(Math.PI*Math.min(1,ne))*.9+.25*ne*(1+.3*br)))});
 // les 9 mots de l'écosystème, un à un, puis restent
 orbit.setAttribute('opacity',f3(.3*cl(t,6.6,7.4)));
 WD.forEach(w=>{const e=oc(cl(t,6.7+w.i*.24,7.3+w.i*.24));w.g.setAttribute('opacity',f3(e*(.9+.1*Math.sin(lp*1.3-w.i*.7))));w.g.setAttribute('transform',`translate(${f1(w.x)},${f1(w.y+8-8*e)})`)});
 sub.textContent=L[t<1.2?0:t<3.1?1:t<4.4?2:t<5.2?3:t<6.5?4:5];
 if(!rm&&qt==null)requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
